<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=1280"><title>ログイン｜チームチャットアプリ</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="auth"><div class="auth__card"><div class="auth__brand"><span class="brandmark">チ</span>チームチャットアプリ</div><h1 class="h-display" style="text-align:center;margin-bottom:var(--sp-6);font-size:var(--fs-title)">ログイン</h1>
<div class="field"><label class="label">メールアドレス</label><input class="input" value="sato@example.com"></div>
<div class="field is-error"><label class="label">パスワード</label><input class="input" type="password" value="1234567"><span class="err">メールアドレスまたはパスワードが正しくありません</span></div>
<button class="btn btn--primary btn--lg btn--block">ログイン</button>
<div class="auth__foot">アカウントをお持ちでない方は <a href="register.html">新規登録</a></div>
<p class="mock-note" style="margin-top:var(--sp-4);text-align:center">※ 見本のため、入力エラーが出た状態を示しています。</p></div></div></body></html>
