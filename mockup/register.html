<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=1280"><title>新規登録｜チームチャットアプリ</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="auth"><div class="auth__card"><div class="auth__brand"><span class="brandmark">チ</span>チームチャットアプリ</div><h1 class="h-display" style="text-align:center;margin-bottom:var(--sp-6);font-size:var(--fs-title)">新規登録</h1>
<div class="field"><label class="label">表示名<span class="req">*</span></label><input class="input" value="佐藤 太郎"><div class="field-foot"><span class="help">メッセージに表示される名前です。</span><span class="count">5 / 30</span></div></div>
<div class="field"><label class="label">メールアドレス<span class="req">*</span></label><input class="input" value="sato@example.com"></div>
<div class="field"><label class="label">パスワード<span class="req">*</span></label><input class="input" type="password" value="12345678"><span class="help">8文字以上で入力してください。</span></div>
<div class="field"><label class="label">パスワード（確認用）<span class="req">*</span></label><input class="input" type="password" value="12345678"></div>
<button class="btn btn--primary btn--lg btn--block">登録する</button>
<div class="auth__foot">すでにアカウントをお持ちの方は <a href="login.html">ログイン</a></div></div></div></body></html>
