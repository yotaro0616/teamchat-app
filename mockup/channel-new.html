<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=1280"><title>チャンネルを作る｜チームチャットアプリ</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="app"><header class="topbar"><div class="topbar__brand"><span class="brandmark">チ</span>チームチャットアプリ</div><div class="topbar__search"><div class="search-input"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14" stroke-linecap="round"/></svg><span>メッセージを検索</span></div></div><div class="topbar__me"><span class="nm">佐藤 太郎</span><a href="login.html">ログアウト</a></div></header><div class="app__body"><nav class="sidebar"><div class="side-group">チャンネル</div><a class="side-item" href="channel-show.html"><span class="sig">#</span><span class="nm">全体連絡</span></a><a class="side-item" href="channel-show.html"><span class="sig">#</span><span class="nm">開発</span></a><a class="side-item" href="channel-show.html"><span class="sig">#</span><span class="nm">雑談</span></a><a class="side-item" href="channel-show.html"><span class="sig"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3.25" y="7" width="9.5" height="6.5" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg></span><span class="nm">採用プロジェクト</span></a><div class="side-foot"><a href="channels.html">チャンネル一覧を見る</a></div></nav><main class="main main--scroll"><div class="page" style="max-width:680px"><h1 class="h-title" style="margin-bottom:var(--sp-6)">チャンネルを作る</h1>
<div class="card"><div class="card__body">
<div class="field is-error"><label class="label">チャンネル名<span class="req">*</span></label><input class="input" value=""><div class="field-foot"><span class="err">チャンネル名を入力してください</span><span class="count">0 / 50</span></div></div>
<div class="field"><label class="label">説明</label><textarea class="textarea">採用まわりの進行</textarea><div class="field-foot"><span class="help">何について話す場所かを短く書きます。</span><span class="count">8 / 200</span></div></div>
<div class="field"><span class="label">公開範囲</span><div class="radio-set">
<label class="radio is-checked"><input type="radio" name="v" checked><span><span class="rt">公開</span><span class="rd" style="display:block">ログインしている社員なら誰でも読み書きできます。</span></span></label>
<label class="radio"><input type="radio" name="v"><span><span class="rt">プライベート</span><span class="rd" style="display:block">追加された人だけが読み書きできます。作成者がメンバーを管理します。</span></span></label>
</div></div>
<div class="inline-2" style="justify-content:flex-end;margin-top:var(--sp-6)"><a class="btn" href="channels.html">キャンセル</a><button class="btn btn--primary">作成する</button></div>
</div></div>
<p class="mock-note" style="margin-top:var(--sp-4)">※ 見本のため、チャンネル名が空のまま送信して入力エラーが出た状態を示しています。</p></div></main></div></div></body></html>
