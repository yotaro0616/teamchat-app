<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=1280"><title>チャンネルを編集する｜チームチャットアプリ</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="app"><header class="topbar"><div class="topbar__brand"><span class="brandmark">チ</span>チームチャットアプリ</div><div class="topbar__search"><div class="search-input"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14" stroke-linecap="round"/></svg><span>メッセージを検索</span></div></div><div class="topbar__me"><span class="nm">佐藤 太郎</span><a href="login.html">ログアウト</a></div></header><div class="app__body"><nav class="sidebar"><div class="side-group">チャンネル</div><a class="side-item" href="channel-show.html"><span class="sig">#</span><span class="nm">全体連絡</span></a><a class="side-item is-selected" href="channel-show.html"><span class="sig">#</span><span class="nm">開発</span></a><a class="side-item" href="channel-show.html"><span class="sig">#</span><span class="nm">雑談</span></a><a class="side-item" href="channel-show.html"><span class="sig"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3.25" y="7" width="9.5" height="6.5" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg></span><span class="nm">採用プロジェクト</span></a><div class="side-foot"><a href="channels.html">チャンネル一覧を見る</a></div></nav><main class="main main--scroll"><div class="page" style="max-width:680px"><h1 class="h-title" style="margin-bottom:var(--sp-6)">チャンネルを編集する</h1>
<div class="card" style="margin-bottom:var(--sp-8)"><div class="card__body">
<div class="field"><label class="label">チャンネル名<span class="req">*</span></label><input class="input" value="開発"><div class="field-foot"><span class="help">公開チャンネルです。公開範囲はあとから変更できません。</span><span class="count">2 / 50</span></div></div>
<div class="field"><label class="label">説明</label><textarea class="textarea">開発に関する相談と報告</textarea><div class="field-foot"><span class="help"></span><span class="count">11 / 200</span></div></div>
<div class="inline-2" style="justify-content:flex-end;margin-top:var(--sp-6)"><a class="btn" href="channel-show.html">キャンセル</a><button class="btn btn--primary">保存する</button></div>
</div></div>
<h2 class="h-heading" style="margin-bottom:var(--sp-3)">チャンネルを削除する</h2>
<div class="danger-box"><div class="spread" style="margin-bottom:var(--sp-4)"><div><div class="t-label" style="color:var(--danger)">このチャンネルを削除します</div><div class="t-caption">メッセージと返信もすべて削除され、元に戻せません。</div></div><button class="btn btn--danger">削除する</button></div>
<div class="card" style="border-color:var(--danger-line)"><div class="card__body"><div class="h-heading" style="margin-bottom:var(--sp-2)">「開発」を削除しますか？</div><p class="t-body t-muted" style="margin-bottom:var(--sp-4)">メッセージ 9件と返信 5件も削除されます。この操作は取り消せません。確認のためチャンネル名を入力してください。</p><input class="input" placeholder="開発" style="max-width:280px"><div class="inline-2" style="justify-content:flex-end;margin-top:var(--sp-5)"><button class="btn">やめる</button><button class="btn btn--danger-solid">削除する</button></div></div></div>
<p class="mock-note" style="margin-top:var(--sp-3)">※ 見本のため、確認の表示を開いた状態で並べています。</p></div>
</div></main></div></div></body></html>
